<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta name="robots" content="noindex,nofollow">
  <title>FinalForge — Page not found</title>
  <link rel="icon" type="image/svg+xml" href="/assets/finalforge-logo.svg">
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0d1928;--line:rgba(148,171,204,.16);--text:#f5f8fc;--muted:#93a4b8;--blue:#5b8cff;--violet:#7a63ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -12%,rgba(91,140,255,.18),transparent 34rem),linear-gradient(180deg,var(--bg),#091421);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,620px);padding:42px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(13,25,40,.96),rgba(10,20,34,.96));box-shadow:0 26px 70px rgba(0,0,0,.28);text-align:center}
    img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(91,140,255,.24))}
    .code{margin-top:22px;color:#90adff;font-size:.72rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:8px 0 12px;font-size:clamp(2rem,7vw,3.7rem);line-height:1;letter-spacing:-.055em}
    p{margin:0 auto 24px;max-width:470px;color:var(--muted);font-size:.96rem;line-height:1.65}
    a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 18px;border-radius:11px;background:linear-gradient(110deg,var(--blue),var(--violet));color:white;font-weight:800;text-decoration:none;box-shadow:0 10px 26px rgba(89,99,255,.24)}
    a:focus-visible{outline:3px solid #8fc8ff;outline-offset:4px}
    @media(max-width:520px){main{padding:30px 20px;border-radius:20px}}
  </style>
</head>
<body>
  <main>
    <img src="/assets/finalforge-logo-256.webp" width="256" height="256" alt="FinalForge">
    <div class="code">Error 404</div>
    <h1>This page isn’t in the forge.</h1>
    <p>The address may be outdated or incorrect. Return to your FinalForge workspace and continue studying.</p>
    <a href="/">Return to FinalForge</a>
  </main>
</body>
</html>
