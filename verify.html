<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark light">
  <title>Verify email — FinalForge</title>
  <link rel="icon" type="image/svg+xml" href="assets/finalforge-logo.svg">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#07111f;color:#eef6ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f}body{min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));background:radial-gradient(700px 420px at 50% -10%,rgba(80,110,255,.16),transparent 62%),linear-gradient(180deg,#081421,#06101c)}
    .wrap{width:min(100%,460px)}.brand{display:flex;align-items:center;gap:10px;margin:0 0 18px 4px;font-weight:850;letter-spacing:-.03em}.brand img{width:34px;height:34px}.card{padding:28px 22px;border:1px solid rgba(130,166,214,.17);border-radius:24px;background:linear-gradient(165deg,rgba(13,28,48,.97),rgba(7,16,29,.99));box-shadow:0 28px 80px rgba(0,0,0,.34)}
    .icon{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#6f65ff,#3d8cff,#27c4d9);font-size:28px;box-shadow:0 14px 32px rgba(65,104,235,.28)}
    .eyebrow{margin-top:20px;color:#7dd3fc;text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:850}h1{margin:7px 0 9px;font-size:clamp(2rem,9vw,2.7rem);line-height:1;letter-spacing:-.055em}p{margin:0;color:#9fb2c8;font-size:.95rem;line-height:1.6}.status{margin:18px 0;padding:13px 14px;border:1px solid rgba(118,156,205,.18);border-radius:14px;background:rgba(72,111,166,.08);color:#cfe0f2;font-size:.88rem;line-height:1.5}.status.ok{border-color:rgba(73,211,164,.26);background:rgba(39,169,126,.10);color:#9de7cb}.status.error{border-color:rgba(248,113,133,.26);background:rgba(207,66,91,.10);color:#ffc1cc}
    .btn{width:100%;min-height:52px;border:0;border-radius:14px;padding:0 16px;font:800 .95rem/1 inherit;color:#fff;background:linear-gradient(112deg,#7466ff,#4a80ff 52%,#25bed8);box-shadow:0 12px 28px rgba(64,102,230,.27);cursor:pointer}.btn[hidden]{display:none}.small{margin-top:12px;text-align:center;color:#73879f;font-size:.78rem}
    @media(max-width:420px){body{padding-inline:14px}.card{padding:24px 18px;border-radius:21px}.brand{margin-left:2px}}
    @media(prefers-color-scheme:light){:root,html,body{background:#eef4fa;color:#172840}.card{background:linear-gradient(180deg,#fff,#f7faff);border-color:#d7e3ef;box-shadow:0 24px 60px rgba(43,72,107,.14)}p{color:#667b92}.status{background:#f0f6fc;border-color:#d5e3f0;color:#405b76}.status.ok{background:#effbf6;border-color:#bce8d6;color:#176f54}.status.error{background:#fff3f5;border-color:#f1c6ce;color:#a33f52}.small{color:#71849a}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img src="assets/finalforge-logo-256.webp" alt=""><span>FinalForge</span></div>
    <section class="card" aria-live="polite">
      <div class="icon" id="icon">✉</div>
      <div class="eyebrow">Secure email verification</div>
      <h1 id="title">Verifying your email…</h1>
      <p id="copy">Keep this page open for a moment. FinalForge is validating the secure verification link.</p>
      <div class="status" id="status">Checking verification code…</div>
      <button class="btn" id="continueBtn" type="button" hidden>Return to FinalForge</button>
      <div class="small">You can safely close this page after FinalForge opens.</div>
    </section>
  </main>

  <script src="assets/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
  (async()=>{
    const $=id=>document.getElementById(id);
    const params=new URLSearchParams(location.search);
    const mode=params.get('mode');
    const code=params.get('oobCode');
    const rawContinue=params.get('continueUrl');
    const fallback=new URL('/?verified=1',location.origin);
    let target=fallback;

    try{
      if(rawContinue){
        const candidate=new URL(rawContinue,location.origin);
        if(candidate.origin===location.origin){candidate.searchParams.set('verified','1');target=candidate;}
      }
    }catch{}

    const go=()=>location.replace(target.href);
    $('continueBtn').addEventListener('click',go);

    try{
      if(mode!=='verifyEmail'||!code)throw new Error('This verification link is incomplete or invalid. Request a new verification email from FinalForge.');
      const cfg=window.FINALFORGE_FIREBASE;
      if(!cfg?.enabled||!cfg?.config)throw new Error('FinalForge verification is temporarily unavailable.');
      if(!firebase.apps.length)firebase.initializeApp(cfg.config);
      await firebase.auth().applyActionCode(code);
      $('icon').textContent='✓';
      $('title').textContent='Email verified';
      $('copy').textContent='Your SLIIT email has been verified successfully. Returning you to FinalForge now.';
      $('status').className='status ok';
      $('status').textContent='Verification complete. Your account is ready to finish signing in.';
      $('continueBtn').hidden=false;
      setTimeout(go,1200);
    }catch(error){
      $('icon').textContent='!';
      $('title').textContent='Verification link problem';
      $('copy').textContent='The link may have expired, already been used, or opened without its verification code.';
      $('status').className='status error';
      $('status').textContent=error?.message||'Verification could not be completed.';
      $('continueBtn').textContent='Back to FinalForge';
      $('continueBtn').hidden=false;
    }
  })();
  </script>
</body>
</html>
