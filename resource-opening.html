<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="dark light">
  <title>FinalForge · Secure resource</title>
  <style>
    :root{--bg:#06101d;--panel:#0b1a2d;--panel2:#0a1626;--text:#f5f9ff;--muted:#91a6bf;--line:rgba(139,180,235,.16);--line2:rgba(91,157,255,.32);--blue:#65a9ff;--cyan:#4dd7d0;--violet:#8f79ff;--danger:#ff8796;--shadow:0 30px 90px rgba(0,0,0,.30)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:clamp(18px,4vw,48px);overflow-x:hidden;background:radial-gradient(760px 460px at 50% 16%,rgba(72,139,235,.15),transparent 68%),radial-gradient(560px 380px at 78% 78%,rgba(143,121,255,.09),transparent 72%),linear-gradient(145deg,#050a12,#071423)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(179,208,248,.22) .65px,transparent .7px);background-size:14px 14px;mask-image:linear-gradient(to bottom,#000,transparent 84%)}
    .shell{position:relative;width:min(560px,100%);padding:clamp(28px,5vw,44px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(155deg,rgba(14,31,52,.97),rgba(8,20,36,.985));box-shadow:var(--shadow);text-align:left;overflow:hidden}
    .shell::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),var(--violet),transparent);opacity:.72}
    .shell::after{content:"";position:absolute;right:-80px;top:-90px;width:230px;height:230px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(91,157,255,.16),transparent 70%)}
    .brand{position:relative;z-index:2;display:flex;align-items:center;gap:11px;margin-bottom:34px;font-weight:840;letter-spacing:-.03em}.brand img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(56,138,255,.28))}
    .state{position:relative;z-index:2;display:grid;grid-template-columns:58px minmax(0,1fr);gap:18px;align-items:start}.visual{width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(91,157,255,.11),rgba(143,121,255,.055));color:#7db8ff}.visual svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.spinner{width:25px;height:25px;border:2px solid rgba(91,157,255,.18);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
    .copy{min-width:0}.eyebrow{margin:1px 0 8px;color:#7eb8ff;font-size:.69rem;font-weight:880;letter-spacing:.15em;text-transform:uppercase}.copy h1{margin:0;font-size:clamp(1.48rem,4.6vw,1.95rem);line-height:1.08;letter-spacing:-.045em}.copy p{margin:12px 0 0;color:var(--muted);font-size:.94rem;line-height:1.68}.detail{position:relative;z-index:2;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--muted);font-size:.76rem}.secure{display:inline-flex;align-items:center;gap:8px}.secure i{width:7px;height:7px;border-radius:50%;background:#59d2aa;box-shadow:0 0 0 4px rgba(89,210,170,.08)}
    .actions{position:relative;z-index:2;display:none;margin-top:26px;gap:10px;flex-wrap:wrap}.actions.show{display:flex}.btn{min-height:46px;padding:0 17px;border:1px solid var(--line);border-radius:12px;background:rgba(116,152,205,.065);color:var(--text);font:760 .85rem/1 system-ui;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .14s ease,border-color .14s ease,filter .14s ease}.btn.primary{background:linear-gradient(110deg,#3f8ff4,#527ee9 56%,#786bea);border-color:rgba(91,140,255,.46);color:#fff;box-shadow:0 12px 28px rgba(63,115,235,.20)}.btn:hover{border-color:var(--line2);transform:translateY(-1px)}.error .visual{color:var(--danger);background:rgba(255,98,122,.07);border-color:rgba(255,117,137,.18)}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:560px){.shell{border-radius:20px}.state{grid-template-columns:1fr}.detail{align-items:flex-start;flex-direction:column}.actions.show{display:grid;grid-template-columns:1fr}.btn{width:100%}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:var(--blue)}.btn{transition:none}.btn:hover{transform:none}}
    @media(prefers-color-scheme:light){:root{--bg:#f2f6fb;--panel:#fff;--panel2:#f8fbff;--text:#15283f;--muted:#63788e;--line:rgba(45,78,118,.14);--line2:rgba(61,112,183,.28);--shadow:0 24px 60px rgba(48,77,111,.12)}body{background:radial-gradient(720px 420px at 50% 20%,rgba(65,126,211,.11),transparent 70%),linear-gradient(145deg,#f8fbff,#edf4fb)}.shell{background:linear-gradient(155deg,#fff,#f7fbff)}}
  </style>
</head>
<body>
  <main id="shell" class="shell" role="status" aria-live="polite">
    <div class="brand"><img src="/assets/finalforge-logo.svg" alt=""><span>FinalForge</span></div>
    <section class="state">
      <div class="visual" id="visual"><span class="spinner" aria-hidden="true"></span></div>
      <div class="copy"><div class="eyebrow" id="eyebrow">Protected library</div><h1 id="title">Opening secure resource</h1><p id="message">Refreshing your secure session, verifying access and preparing a short-lived protected link.</p></div>
    </section>
    <div class="actions" id="actions"><a class="btn primary" id="primaryAction" href="/">Return to FinalForge</a><button class="btn" type="button" onclick="window.close()">Close tab</button></div>
    <div class="detail"><span class="secure"><i aria-hidden="true"></i><span>Private resource delivery</span></span><span>FinalForge · Forge Your Academic Edge.</span></div>
  </main>
  <script>
    (()=>{
      const q=new URLSearchParams(location.search);const state=q.get('state')==='error'?'error':'loading';const reason=q.get('reason')||'';
      if(state!=='error')return;
      const messages={
        auth:['Session needs attention','Your current Firebase session could not be verified after a secure refresh. Return to FinalForge and sign in again, then open the resource once more.'],
        access:['Access could not be verified','Your signed-in account could not be matched to an active approved student entitlement. Return to FinalForge, refresh once and try again.'],
        authz:['Verification service unavailable','Your browser session is present, but the secure server could not complete authentication or entitlement verification. Please return to FinalForge and try again shortly.'],
        missing:['Resource unavailable','This resource is not currently available in the protected library.'],
        storage:['Resource service unavailable','Your account was verified, but the private file service could not prepare this resource. Please try again shortly.'],
        timeout:['Request took too long','The secure resource request timed out. Check your connection and try again.'],
        unavailable:['Resource could not be opened','The protected resource could not be prepared. Please return to FinalForge and try again.']
      };
      const [title,message]=messages[reason]||messages.unavailable;document.getElementById('shell').classList.add('error');document.getElementById('eyebrow').textContent='Secure resource';document.getElementById('title').textContent=title;document.getElementById('message').textContent=message;document.getElementById('visual').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5m0 3h.01M10.3 3.8 2.5 17.3A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.7L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg>';document.getElementById('actions').classList.add('show');
    })();
  </script>
</body>
</html>
