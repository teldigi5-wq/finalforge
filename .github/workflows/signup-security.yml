name: FinalForge main signup security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/main-signup-admission-backport-20261021]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:security
      - run: npm run test:security
      - name: Enforce server-only account creation
        run: |
          grep -F "fetch('/api/signup'" assets/auth.js
          ! grep -F 'createUserWithEmailAndPassword(' assets/auth.js
          test -f api/signup.js
