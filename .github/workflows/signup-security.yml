name: FinalForge signup security checks
on:
  pull_request:
  push:
    branches:
      - security/signup-contract-reliability-20261021
      - fix/firebase-activation-hardening
permissions:
  contents: read
jobs:
  signup-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check api/signup.js
      - run: node --test tests/signup.test.js tests/signup-fix-v2.test.js
      - name: Verify client uses server-side signup
        run: |
          grep -F "fetch('/api/signup'" assets/auth.js
          ! grep -F 'createUserWithEmailAndPassword(' assets/auth.js
