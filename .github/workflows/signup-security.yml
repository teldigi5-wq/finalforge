name: FinalForge main signup security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/main-signup-admission-backport-20261021]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:security
      - run: npm run test:security
      - run: node --test tests/firestore-rules-policy.test.js
      - run: node --test tests/auth-dom-safety.test.js
      - run: node --test tests/admin-table-safety.test.js
      - run: node --test tests/workflow-security.test.js
      - name: Enforce server-only account creation
        run: |
          grep -F "fetch('/api/signup'" assets/auth.js
          ! grep -F 'createUserWithEmailAndPassword(' assets/auth.js
          test -f api/signup.js
