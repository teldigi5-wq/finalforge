name: Offline signup performance baseline
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmark-signup.mjs'
      - 'package.json'
      - '.github/workflows/signup-benchmark.yml'
      - 'api/signup.js'
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark-signup.mjs'
      - 'package.json'
      - '.github/workflows/signup-benchmark.yml'
      - 'api/signup.js'
permissions:
  contents: read
jobs:
  offline-signup-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies with lifecycle scripts disabled
        run: npm ci --ignore-scripts
      - name: Check benchmark source
        run: node --check scripts/benchmark-signup.mjs
      - name: Execute synthetic denial paths only
        run: npm run benchmark:offline
      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finalforge-offline-signup-benchmark
          path: benchmark-results.json
          if-no-files-found: warn
          retention-days: 14
