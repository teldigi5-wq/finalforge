name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - fix/private-resource-delivery-v1
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - fix/private-resource-delivery-v1

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Prepare public frontend bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf azure-static
          mkdir -p azure-static

          cp \
            index.html \
            verify.html \
            404.html \
            manifest.webmanifest \
            sw.js \
            staticwebapp.config.json \
            azure-static/

          cp -R assets azure-static/assets
          cp -R mock-papers azure-static/mock-papers

          forbidden=(
            package.json
            package-lock.json
            api
            azure-api
            firebase
            tests
            docs
            PRIVATE_RESOURCE_DELIVERY.md
            AUTH_AND_DEPLOY_SETUP.md
            BUILD_STEPS.md
            README.md
            vercel.json
            tailwind.config.cjs
          )

          for path in "${forbidden[@]}"; do
            if [ -e "azure-static/$path" ]; then
              echo "::error::Forbidden deployment path present: $path"
              exit 1
            fi
          done

          test -f azure-static/index.html
          test -f azure-static/staticwebapp.config.json
          test -f azure-static/assets/resource-delivery-v1.js
          test -f azure-static/mock-papers/index.html

          echo "Prepared allowlisted FinalForge frontend bundle."

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_MUD_07AAF0900 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          app_location: "azure-static"
          skip_app_build: true
          api_location: "azure-api"
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_MUD_07AAF0900 }}
          action: "close"
