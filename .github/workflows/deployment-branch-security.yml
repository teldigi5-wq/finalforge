name: FinalForge deployed-branch security analysis

on:
  push:
    branches: [fix/firebase-activation-hardening]
  pull_request:
    branches: [fix/firebase-activation-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # immutable v4 reference
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # immutable v4 reference
