<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>FinalForge — Mock Paper Pack</title><style>body{margin:0;background:#07101d;color:#f2f7fd;font:15px/1.5 system-ui;padding:28px}.wrap{max-width:1100px;margin:auto}h1{font-size:clamp(32px,6vw,48px);margin:.15em 0}.muted{color:#9db0c8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.card{background:#0e1b2d;border:1px solid #213956;border-radius:18px;padding:18px}.papers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}button,a{font:inherit;color:#fff;text-decoration:none;border:1px solid #315270;background:#142b46;padding:10px;border-radius:10px;text-align:center;cursor:pointer}button:hover,a:hover{background:#1a3657}.guide{font-size:11px;color:#9ed8ff;display:block;margin-top:4px}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}@media(max-width:700px){body{padding:18px}.grid{grid-template-columns:1fr}.papers{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">FinalForge • Forge Your Academic Edge</div><h1>Printable Mock Paper Pack</h1></div><a href="../index.html">← Back to FinalForge</a></div><div class="muted">Three repeatable practice papers plus marking guides for each module. Open any item, then use your browser's Print / Save as PDF.</div><div id="status" class="muted" style="margin-top:12px">Loading paper pack…</div><div class="grid" id="grid"></div></div><script>
const mods={dcn:['🌐','IE1030 — DCN','2 hours • MCQ + structured + essay'],ip:['☕','IT1120 — IP','2 hours • 25 MCQs + 2 Java programs'],mc:['∑','IT1130 — MC','2 hours • 4 structured questions'],fc:['🧠','IT1140 — FC','2 hours • 4 essay-type questions']};let pack={};
function openDoc(path){const html=pack[path];if(!html)return alert('Paper could not be loaded.');const w=open('','_blank');w.document.open();w.document.write(html);w.document.close()}
(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Update your browser to open the optimized paper pack.');const r=await fetch('pack.bundle.gz',{cache:'no-cache'});if(!r.ok)throw new Error('Paper pack request failed.');const t=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();pack=JSON.parse(t);document.getElementById('status').textContent='24 printable documents ready.';document.getElementById('grid').innerHTML=Object.entries(mods).map(([m,x])=>`<div class="card"><h2>${x[0]} ${x[1]}</h2><div class="muted">${x[2]}</div><div class="papers">${[1,2,3].map(n=>`<div><button onclick="openDoc('${m}/paper-${n}.html')">Paper ${n}</button><button class="guide" onclick="openDoc('${m}/paper-${n}-guide.html')">Marking guide</button></div>`).join('')}</div></div>`).join('')}catch(e){document.getElementById('status').textContent=e.message}})();
</script></body></html>
